<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header>
      <h1>Expense Tracker</h1>
      <p class="subtitle">Track your income and spending. Your data stays in your browser.</p>
    </header>
 
    <section class="summary">
      <div class="card">
        <span class="label">Balance</span>
        <span id="balance" class="value">0.00</span>
      </div>
      <div class="card income">
        <span class="label">Income</span>
        <span id="income" class="value">0.00</span>
      </div>
      <div class="card expense">
        <span class="label">Expenses</span>
        <span id="expense" class="value">0.00</span>
      </div>
    </section>
 
    <section class="panel">
      <h2>Add a transaction</h2>
      <form id="form">
        <input id="title" type="text" placeholder="Description (e.g. Groceries)" required maxlength="60" />
        <input id="amount" type="number" placeholder="Amount" min="0.01" step="0.01" required />
        <select id="type">
          <option value="expense">Expense</option>
          <option value="income">Income</option>
        </select>
        <select id="category">
          <option>Food</option>
          <option>Transport</option>
          <option>Shopping</option>
          <option>Bills</option>
          <option>Health</option>
          <option>Entertainment</option>
          <option>Salary</option>
          <option>Other</option>
        </select>
        <input id="date" type="date" required />
        <button type="submit">Add</button>
      </form>
    </section>
 
    <section class="panel">
      <div class="panel-head">
        <h2>Transactions</h2>
        <div class="filters">
          <input id="filter-month" type="month" title="Filter by month" />
          <select id="filter-category">
            <option value="all">All categories</option>
          </select>
          <button id="export" class="secondary" type="button">Export CSV</button>
        </div>
      </div>
      <ul id="list" class="list"></ul>
      <p id="empty" class="empty">No transactions yet. Add your first one above.</p>
    </section>
 
    <section class="panel">
      <h2>Spending by category</h2>
      <div id="breakdown" class="breakdown"></div>
      <p id="breakdown-empty" class="empty">No expenses to show.</p>
    </section>
  </main>
 
  <script src="script.js"></script>
</body>
</html>
